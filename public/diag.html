<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNO Connection Diagnostic</title>
<style>
body { font-family: system-ui, sans-serif; padding: 24px; max-width: 640px; margin: 0 auto; }
h1 { font-size: 20px; }
.log { font-size: 15px; line-height: 1.8; }
.ok { color: #15803D; font-weight: 700; }
.bad { color: #B91C1C; font-weight: 700; }
</style>
</head>
<body>
<h1>UNO Connection Diagnostic</h1>
<div class="log" id="log">Running tests…</div>
<script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-database-compat.js"></script>
<script>
var logEl = document.getElementById('log');
function log(html){ var d = document.createElement('div'); d.innerHTML = html; logEl.appendChild(d); }
var DB = 'ashramam-network-default-rtdb.firebaseio.com';
// T1: plain HTTPS reachability
log('T1: HTTPS to game database…');
fetch('https://' + DB + '/.json').then(function(r){ return r.text().then(function(){
  log('T1 RESULT: HTTPS <span class="ok">reachable</span> (HTTP ' + r.status + ')');
}); }).catch(function(e){ log('T1 RESULT: HTTPS <span class="bad">FAILED</span> — ' + e.message); });
// T2: raw WebSocket
setTimeout(function(){
  log('T2: WebSocket to game database…');
  try {
    var ws = new WebSocket('wss://' + DB + '/.ws?ns=ashramam-network-default-rtdb&v=5');
    var done = false;
    ws.onopen = function(){ done = true; log('T2 RESULT: WebSocket <span class="ok">OPEN</span>'); try { ws.close(); } catch(e){} };
    ws.onerror = function(){ log('T2 note: websocket error event fired'); };
    ws.onclose = function(e){ if(!done) log('T2 RESULT: WebSocket <span class="bad">CLOSED</span> (code ' + e.code + ')'); };
    setTimeout(function(){ if(!done) log('T2 RESULT: WebSocket <span class="bad">not open after 12s</span> (state ' + ws.readyState + ')'); }, 12000);
  } catch(e){ log('T2 RESULT: WebSocket <span class="bad">threw</span> — ' + e.message); }
}, 1500);
// T3: Firebase SDK .info/connected (same call the UNO lobby makes)
setTimeout(function(){
  log('T3: Firebase SDK connection…');
  try {
    var app = firebase.initializeApp({ databaseURL: 'https://' + DB }, 'diagapp');
    var ok = false;
    firebase.database(app).ref('.info/connected').on('value', function(s){
      log('T3: .info/connected = ' + s.val());
      if (s.val() === true) { ok = true; log('T3 RESULT: <span class="ok">CONNECTED</span>'); }
    });
    setTimeout(function(){ if(!ok) log('T3 RESULT: <span class="bad">NOT connected after 20s</span>'); }, 20000);
  } catch(e){ log('T3 THREW: ' + (e && e.message)); }
}, 3000);
</script>
</body>
</html>
